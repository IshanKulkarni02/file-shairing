<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in — LANShare</title>
<meta name="theme-color" content="#AEE2F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2E2621" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<main class="login">
  <div class="login__card">
    <div class="login__blob" aria-hidden="true">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="3"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="m21 15-5-5L5 21"/>
      </svg>
    </div>

    <h1>LANShare</h1>
    <p class="login__sub">Your photos and videos, on your own network.</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label class="field__label" for="username">Username</label>
        <input class="field__input" id="username" name="username" type="text"
               autocomplete="username" autocapitalize="none" autocorrect="off"
               spellcheck="false" required value="admin">
      </div>

      <div class="field">
        <label class="field__label" for="password">Password</label>
        <input class="field__input" id="password" name="password" type="password"
               autocomplete="current-password" required>
      </div>

      <p class="field__error" id="error" role="alert"></p>

      <button class="btn btn--primary" type="submit" id="submit">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
          <path d="m10 17 5-5-5-5"/><path d="M15 12H3"/>
        </svg>
        Sign in
      </button>
    </form>

    <p class="login__note">
      First time? The password was printed in the window where you started
      LANShare on your computer.
    </p>
  </div>
</main>

<script>
const form = document.getElementById('loginForm');
const errorEl = document.getElementById('error');
const submitBtn = document.getElementById('submit');

function showError(message) {
  errorEl.textContent = message;
  errorEl.classList.add('is-shown');
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  errorEl.classList.remove('is-shown');
  submitBtn.disabled = true;

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });

    if (res.ok) {
      // Honour ?next= so a deep link survives the sign-in detour.
      const next = new URLSearchParams(location.search).get('next');
      location.href = next && next.startsWith('/') ? next : '/';
      return;
    }

    const data = await res.json().catch(() => ({}));
    showError(data.error || 'Could not sign in.');
    document.getElementById('password').select();
  } catch {
    showError('Cannot reach the server. Is it still running?');
  } finally {
    submitBtn.disabled = false;
  }
});

// A phone keyboard covering the password field is less annoying than
// hunting for it, so focus only where there is room.
if (window.matchMedia('(min-width: 720px)').matches) {
  document.getElementById('password').focus();
}
</script>

</body>
</html>
