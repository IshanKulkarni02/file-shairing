<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="LANShare">
  <defs>
    <linearGradient id="clay" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FFB08A"/>
      <stop offset="1" stop-color="#FF8A5B"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#C7EBF9"/>
      <stop offset="1" stop-color="#AEE2F6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#4A3B32" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="120" fill="url(#sky)"/>

  <!-- Lumpy clay blob: the corner radii are deliberately uneven. -->
  <path filter="url(#soft)" fill="url(#clay)"
        d="M256 78c62 0 108 16 134 46s36 74 34 132c-2 58-18 100-48 126s-72 36-124 34c-56-2-98-16-124-46s-38-74-34-132c4-56 20-96 50-122S196 78 256 78Z"/>

  <!-- Photo mark -->
  <g fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <rect x="160" y="176" width="192" height="160" rx="34"/>
    <path d="M352 288l-52-52-86 86"/>
  </g>
  <circle cx="212" cy="224" r="18" fill="#FFFFFF"/>
</svg>
