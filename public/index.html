<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LANShare</title>
<meta name="theme-color" content="#AEE2F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2E2621" media="(prefers-color-scheme: dark)">
<meta name="description" content="Your photos and videos, on your own network.">

<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">

<!-- Standalone launch from the iOS home screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LANShare">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<!-- Icon sprite: referenced with <use>, so each glyph is defined once. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="i-image" fill="none" stroke="currentColor" stroke-width="2.25"
       stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="3"/>
      <circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>
    </g>
    <g id="i-folder" fill="none" stroke="currentColor" stroke-width="2.25"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 20a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2Z"/>
    </g>
    <!-- An album that lives on another drive: a folder standing on a disk. -->
    <g id="i-drive" fill="none" stroke="currentColor" stroke-width="2.25"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 15a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2Z"/>
      <rect x="3" y="17" width="18" height="4" rx="1.5"/>
      <path d="M6.5 19h.01"/>
    </g>
    <!-- The same drive, unplugged: the disk is struck through. -->
    <g id="i-drive-off" fill="none" stroke="currentColor" stroke-width="2.25"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 15a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2Z"/>
      <rect x="3" y="17" width="18" height="4" rx="1.5"/>
      <path d="m2 22 20-20"/>
    </g>
    <g id="i-upload" fill="none" stroke="currentColor" stroke-width="2.25"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <path d="m7 9 5-5 5 5"/><path d="M12 4v12"/>
    </g>
    <g id="i-download" fill="none" stroke="currentColor" stroke-width="2.25"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <path d="m7 11 5 5 5-5"/><path d="M12 4v12"/>
    </g>
    <g id="i-trash" fill="none" stroke="currentColor" stroke-width="2.25"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/>
      <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
    </g>
    <g id="i-plus" fill="none" stroke="currentColor" stroke-width="2.5"
       stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></g>
    <g id="i-close" fill="none" stroke="currentColor" stroke-width="2.5"
       stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></g>
    <g id="i-check" fill="none" stroke="currentColor" stroke-width="3"
       stroke-linecap="round" stroke-linejoin="round"><path d="m20 6-11 11-5-5"/></g>
    <g id="i-play" fill="currentColor" stroke="none"><path d="M8 5.5v13l11-6.5Z"/></g>
    <g id="i-prev" fill="none" stroke="currentColor" stroke-width="2.5"
       stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></g>
    <g id="i-next" fill="none" stroke="currentColor" stroke-width="2.5"
       stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></g>
    <g id="i-pencil" fill="none" stroke="currentColor" stroke-width="2.25"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>
    </g>
    <g id="i-move" fill="none" stroke="currentColor" stroke-width="2.25"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 20a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2Z"/>
      <path d="M12 11v6"/><path d="m9.5 13.5 2.5-2.5 2.5 2.5"/>
    </g>
    <g id="i-signout" fill="none" stroke="currentColor" stroke-width="2.25"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
      <path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>
    </g>
    <g id="i-film" fill="none" stroke="currentColor" stroke-width="2.25"
       stroke-linecap="round" stroke-linejoin="round">
      <rect x="2.5" y="4" width="19" height="16" rx="2.5"/>
      <path d="M7 4v16M17 4v16M2.5 12h19M2.5 8h4.5M2.5 16h4.5M17 8h4.5M17 16h4.5"/>
    </g>
    <g id="i-lock" fill="none" stroke="currentColor" stroke-width="2.25"
       stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="10.5" width="16" height="10.5" rx="2.5"/>
      <path d="M7.75 10.5V7a4.25 4.25 0 0 1 8.5 0v3.5"/>
    </g>
    <g id="i-unlock" fill="none" stroke="currentColor" stroke-width="2.25"
       stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="10.5" width="16" height="10.5" rx="2.5"/>
      <path d="M7.75 10.5V7a4.25 4.25 0 0 1 8.1-1.8"/>
    </g>
    <g id="i-search" fill="none" stroke="currentColor" stroke-width="2.25"
       stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>
    </g>
  </defs>
</svg>

<header class="topbar">
  <div class="topbar__inner">
    <div class="brand">
      <span class="brand__blob" aria-hidden="true">
        <svg class="icon" viewBox="0 0 24 24"><use href="#i-image"/></svg>
      </span>
      <span class="brand__text">LANShare</span>
    </div>

    <div class="topbar__search">
      <svg class="icon topbar__search-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search"/></svg>
      <label class="sr-only" for="searchInput">Search your library</label>
      <input class="topbar__search-input" id="searchInput" type="search"
             placeholder="Search your library" autocomplete="off">
      <button class="topbar__search-clear" id="searchClearBtn" type="button"
              aria-label="Clear search" hidden>
        <svg class="icon" viewBox="0 0 24 24"><use href="#i-close"/></svg>
      </button>
    </div>

    <div class="topbar__actions">
      <button class="btn btn--primary" id="uploadBtn">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-upload"/></svg>
        <span class="upload-label">Add</span>
      </button>
      <button class="btn btn--icon btn--ghost" id="signOutBtn" title="Sign out" aria-label="Sign out">
        <svg class="icon" viewBox="0 0 24 24"><use href="#i-signout"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="shell">
  <nav class="crumbs" id="crumbs" aria-label="Folders"></nav>

  <div class="toolbar">
    <button class="btn btn--ghost" id="newAlbumBtn">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-plus"/></svg>
      New album
    </button>
    <button class="btn btn--ghost" id="newVaultBtn">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-lock"/></svg>
      New vault
    </button>
    <button class="btn btn--ghost" id="newE2eVaultBtn">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-lock"/></svg>
      New private vault
    </button>
    <button class="btn btn--ghost" id="lockVaultBtn" hidden>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-lock"/></svg>
      Lock this album
    </button>

    <div class="toolbar__spacer"></div>

    <label class="sr-only" for="sort">Sort by</label>
    <select class="select" id="sort">
      <option value="newest">Newest first</option>
      <option value="oldest">Oldest first</option>
      <option value="name">Name</option>
      <option value="largest">Largest first</option>
    </select>
  </div>

  <!-- Shown instead of the grid when the current album is a locked vault. -->
  <section class="locked" id="lockedSection" hidden>
    <div class="locked__blob" aria-hidden="true">
      <svg class="icon" viewBox="0 0 24 24"><use href="#i-lock"/></svg>
    </div>
    <h2>This album is locked</h2>
    <p id="lockedNote">Enter its passphrase to see what is inside.</p>

    <form id="unlockForm" class="locked__form">
      <label class="sr-only" for="unlockSecret">Passphrase</label>
      <input class="field__input" id="unlockSecret" type="password"
             autocomplete="current-password" placeholder="Passphrase">
      <p class="field__error" id="unlockError" role="alert"></p>
      <button class="btn btn--primary btn--full" type="submit" id="unlockBtn">Unlock</button>
      <button class="btn btn--ghost btn--full" type="button" id="useRecoveryBtn">
        Use a recovery code instead
      </button>
    </form>
  </section>

  <section id="albumsSection" hidden>
    <h2 class="section-title">
      Albums <span class="section-title__count" id="albumCount"></span>
    </h2>
    <div class="albums" id="albums"></div>
  </section>

  <section id="mediaSection" hidden>
    <h2 class="section-title">
      <span id="mediaHeading">Photos &amp; videos</span> <span class="section-title__count" id="mediaCount"></span>
    </h2>
    <div class="mosaic" id="mosaic"></div>
  </section>

  <div class="empty" id="empty" hidden>
    <div class="empty__blob" aria-hidden="true">
      <svg class="icon" viewBox="0 0 24 24"><use href="#i-image"/></svg>
    </div>
    <h2 id="emptyTitle">Nothing here yet</h2>
    <p id="emptyNote">Add photos and videos from this device, or from your phone by opening
       this same address there.</p>
    <button class="btn btn--primary" id="emptyUploadBtn">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-upload"/></svg>
      Add photos &amp; videos
    </button>
  </div>
</main>

<!-- Selection actions -->
<div class="actionbar" id="actionbar" role="toolbar" aria-label="Selection actions">
  <span class="actionbar__count" id="selCount">0</span>
  <button class="btn btn--icon" id="selDownload" title="Download" aria-label="Download">
    <svg class="icon" viewBox="0 0 24 24"><use href="#i-download"/></svg>
  </button>
  <button class="btn btn--icon" id="selMove" title="Move to album" aria-label="Move to album">
    <svg class="icon" viewBox="0 0 24 24"><use href="#i-move"/></svg>
  </button>
  <button class="btn btn--icon" id="selRename" title="Rename" aria-label="Rename">
    <svg class="icon" viewBox="0 0 24 24"><use href="#i-pencil"/></svg>
  </button>
  <button class="btn btn--icon btn--danger" id="selDelete" title="Delete" aria-label="Delete">
    <svg class="icon" viewBox="0 0 24 24"><use href="#i-trash"/></svg>
  </button>
  <button class="btn btn--icon btn--ghost" id="selClear" title="Cancel" aria-label="Cancel selection">
    <svg class="icon" viewBox="0 0 24 24"><use href="#i-close"/></svg>
  </button>
</div>

<!-- Full-screen viewer -->
<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Media viewer">
  <div class="viewer__bar">
    <span class="viewer__title" id="viewerTitle"></span>
    <button class="viewer__btn" id="viewerDownload" title="Download" aria-label="Download">
      <svg class="icon" viewBox="0 0 24 24"><use href="#i-download"/></svg>
    </button>
    <button class="viewer__btn" id="viewerDelete" title="Delete" aria-label="Delete">
      <svg class="icon" viewBox="0 0 24 24"><use href="#i-trash"/></svg>
    </button>
    <button class="viewer__btn" id="viewerClose" title="Close" aria-label="Close">
      <svg class="icon" viewBox="0 0 24 24"><use href="#i-close"/></svg>
    </button>
  </div>

  <div class="viewer__stage" id="viewerStage">
    <button class="viewer__nav viewer__nav--prev" id="viewerPrev" aria-label="Previous">
      <svg class="icon" viewBox="0 0 24 24"><use href="#i-prev"/></svg>
    </button>
    <button class="viewer__nav viewer__nav--next" id="viewerNext" aria-label="Next">
      <svg class="icon" viewBox="0 0 24 24"><use href="#i-next"/></svg>
    </button>
  </div>

  <p class="viewer__hint" id="viewerHint"></p>
</div>

<!-- Upload progress -->
<div class="uploads" id="uploads" aria-live="polite">
  <div class="uploads__head">
    <span class="uploads__title" id="uploadsTitle">Uploading</span>
    <button class="btn btn--icon btn--ghost" id="uploadsClose" aria-label="Hide uploads">
      <svg class="icon" viewBox="0 0 24 24"><use href="#i-close"/></svg>
    </button>
  </div>
  <div class="uploads__list" id="uploadsList"></div>
</div>

<div class="dropzone" id="dropzone">
  <div class="dropzone__inner">
    <h2>Drop to add</h2>
    <p>Photos, videos and whole folders are all fine.</p>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<input type="file" id="filePicker" multiple accept="image/*,video/*" hidden>
<input type="file" id="folderPicker" multiple webkitdirectory hidden>

<script src="/assets/vaultcrypto.js"></script>
<script src="/assets/app.js"></script>
</body>
</html>
